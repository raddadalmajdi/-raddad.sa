  <!-- Stats row -->
  <!-- Founded -->
  <rect x="20" y="294" width="107" height="80" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="73" y="322" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">FOUNDED</text>
  <text x="73" y="354" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="900" fill="#f9a8d4">1997</text>

  <!-- Age -->
  <rect x="142" y="294" width="108" height="80" rx="12" fill="rgba(255,255,255,0.08)"/>
