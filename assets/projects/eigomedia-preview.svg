  <rect x="20" y="688" width="352" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="196" y="710" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">DEVELOPED BY</text>
  <text x="196" y="730" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="800" fill="#5eead4">raddad.sa</text>

