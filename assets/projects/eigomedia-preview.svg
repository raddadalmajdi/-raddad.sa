  <text x="196" y="103" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">&#82f1;&#8a9e;&#30e1;&#30c7;&#30a3;&#30a2;</text>

