  <rect x="20" y="582" width="352" height="40" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="608" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">E-Learning · Japan Market</text>

  <rect x="20" y="632" width="352" height="40" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="658" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Web Platform · Firebase</text>

