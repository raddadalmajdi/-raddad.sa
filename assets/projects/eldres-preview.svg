<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 804" width="392" height="804">
  <defs>
    <linearGradient id="bgEl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="cardEl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="100%" stop-color="#0f3060"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="392" height="804" fill="url(#bgEl)"/>

  <!-- Status bar -->
  <rect width="392" height="48" fill="rgba(0,0,0,0.4)"/>
  <text x="40" y="30" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" font-weight="600">9:41</text>
  <text x="352" y="30" text-anchor="end" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">100%</text>

  <!-- App header bar -->
  <rect y="48" width="392" height="64" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="86" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="1">ELDRES</text>
  <text x="196" y="105" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Senior Care Management</text>

  <!-- US Flag stripe at top of content -->
  <rect y="112" width="392" height="5" fill="#B22234"/>
  <rect y="117" width="392" height="5" fill="#ffffff"/>
  <rect y="122" width="392" height="5" fill="#B22234"/>

  <!-- Domain authority card -->
  <rect x="20" y="144" width="352" height="90" rx="14" fill="url(#cardEl)"/>
  <text x="196" y="170" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">PREMIUM DOMAIN</text>
  <text x="196" y="204" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="32" font-weight="900" fill="#ffffff">eldres.com</text>
  <text x="196" y="224" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Boston, Massachusetts, USA</text>

  <!-- Stats row -->
  <!-- Founded -->
  <rect x="20" y="252" width="107" height="80" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="73" y="280" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">FOUNDED</text>
  <text x="73" y="312" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="900" fill="#60a5fa">2001</text>

  <!-- Age -->
  <rect x="142" y="252" width="108" height="80" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="196" y="280" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">DOMAIN AGE</text>
  <text x="196" y="308" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" font-weight="900" fill="#34d399">25 yrs</text>

  <!-- Backlinks -->
  <rect x="265" y="252" width="107" height="80" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="318" y="280" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">BACKLINKS</text>
  <text x="318" y="312" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="900" fill="#f59e0b">861</text>

  <!-- US Sites badge -->
  <rect x="20" y="348" width="352" height="48" rx="12" fill="rgba(178,34,52,0.2)" stroke="rgba(178,34,52,0.4)" stroke-width="1"/>
  <text x="196" y="378" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#f87171">861 US Referring Sites</text>

  <!-- Divider -->
  <rect x="60" y="414" width="272" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Features -->
  <rect x="20" y="428" width="352" height="44" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="456" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Senior Care Schedule &amp; Tracking</text>

  <rect x="20" y="482" width="352" height="44" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="510" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Family Communication Portal</text>

  <rect x="20" y="536" width="352" height="44" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="564" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Health Reports &amp; Reminders</text>

  <rect x="20" y="590" width="352" height="44" rx="10" fill="rgba(255,255,255,0.05)"/>
  <text x="196" y="618" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">iOS &amp; Android · Firebase</text>

  <!-- Dev badge -->
  <rect x="20" y="652" width="352" height="56" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="196" y="676" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)" letter-spacing="1.5">DEVELOPED BY</text>
  <text x="196" y="698" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="800" fill="#5eead4">raddad.sa</text>

  <!-- Bottom home indicator -->
  <rect y="760" width="392" height="44" fill="rgba(0,0,0,0.35)"/>
  <rect x="156" y="777" width="80" height="5" rx="3" fill="rgba(255,255,255,0.25)"/>
</svg>
