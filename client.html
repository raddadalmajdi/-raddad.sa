<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>لوحة العميل | raddad.sa</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/platform.css">
</head>
<body class="platform-body">
    <header class="site-nav">
        <div class="site-nav__inner">
            <a class="nav-brand" href="/"><img src="/assets/logo.svg" alt="" width="38" height="41"><span>رّداد · raddad.sa</span></a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">القائمة</button>
            <nav class="nav-panel" id="main-nav" aria-label="التنقل الرئيسي">
                <a href="/">الرئيسية</a>
                <a href="/services.html">الخدمات</a>
                <a href="/work.html">الأعمال</a>
                <a href="/process.html">آلية العمل</a>
                <a href="/request.html">طلب فكرة</a>
                <a href="/login.html">تسجيل الدخول</a>
                <a href="/client.html">لوحة العميل</a>
                <a href="/contact.html">تواصل</a>
            </nav>
        </div>
    </header>
    <main class="container page">
    <div class="wrap">
        <div class="topbar">
            <h1>لوحة العميل</h1>
            <button class="btn-ghost" type="button" data-logout>تسجيل الخروج</button>
        </div>

        <p class="status-banner status-banner--warn" data-config-status></p>
        <p class="muted" data-user-welcome style="margin-bottom:14px;"></p>

        <div class="grid-2">
            <section class="card">
                <h2>فتح تذكرة جديدة</h2>
                <form id="ticket-form" class="form-grid">
                    <div class="field"><label for="ticket-title">عنوان التذكرة</label><input id="ticket-title" name="title" required></div>
                    <div class="field">
                        <label for="ticket-priority">الأولوية</label>
                        <select id="ticket-priority" name="priority">
                            <option value="normal">عادي</option>
                            <option value="high">عاجل</option>
                            <option value="low">منخفض</option>
                        </select>
                    </div>
                    <div class="field"><label for="ticket-body">تفاصيل الطلب</label><textarea id="ticket-body" name="body" required></textarea></div>
                    <button class="btn-primary" type="submit">إرسال التذكرة</button>
                    <p class="form-message" hidden></p>
                </form>
            </section>

            <section class="card">
                <h2>تذاكري</h2>
                <div data-tickets-list></div>
            </section>
        </div>
    </div>
    </main>

    <script src="/js/firebase-config.js"></script>
    <script type="module" src="/js/client.bundle.js"></script>
    <script src="/js/nav.js" defer></script>
</body>
</html>
