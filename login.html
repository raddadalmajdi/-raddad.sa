<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | raddad.sa</title>
    <link rel="icon" href="/assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/platform.css">
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <h1>بوابة العملاء</h1>
            <a class="btn-secondary" href="/">العودة للموقع</a>
        </div>
        <p class="status-banner status-banner--warn" data-config-status></p>

        <div class="card" data-tabs>
            <div class="tabs">
                <button class="tab-btn is-active" type="button" data-tab-target="tab-register">إنشاء حساب</button>
                <button class="tab-btn" type="button" data-tab-target="tab-login">تسجيل الدخول</button>
            </div>

            <div class="tab-panel is-active" id="tab-register" data-tab-panel>
                <form id="register-form" class="form-grid">
                    <div class="field"><label for="reg-name">الاسم الكامل</label><input id="reg-name" name="name" required></div>
                    <div class="field"><label for="reg-email">البريد الإلكتروني</label><input id="reg-email" name="email" type="email" required></div>
                    <div class="field"><label for="reg-phone">رقم الجوال</label><input id="reg-phone" name="phone" required></div>
                    <div class="field"><label for="reg-company">الشركة (اختياري)</label><input id="reg-company" name="company"></div>
                    <div class="field"><label for="reg-password">كلمة المرور</label><input id="reg-password" name="password" type="password" minlength="6" required></div>
                    <button class="btn-primary" type="submit">إنشاء حساب</button>
                    <p class="form-message" hidden></p>
                </form>
            </div>

            <div class="tab-panel" id="tab-login" data-tab-panel>
                <form id="login-form" class="form-grid">
                    <div class="field"><label for="login-email">البريد الإلكتروني</label><input id="login-email" name="email" type="email" required></div>
                    <div class="field"><label for="login-password">كلمة المرور</label><input id="login-password" name="password" type="password" minlength="6" required></div>
                    <button class="btn-primary" type="submit">تسجيل الدخول</button>
                    <p class="form-message" hidden></p>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/firebase-config.js"></script>
    <script type="module" src="/js/login.bundle.js"></script>
</body>
</html>
