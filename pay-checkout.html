<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>إتمام الدفع | raddad.sa</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.14.0/moyasar.css">
    <link rel="stylesheet" href="/css/pay-checkout.css">
</head>
<body class="pay-checkout-body">
    <header class="pay-checkout-header">
        <a href="/">رّداد · raddad.sa</a>
        <a href="/pay.html">← تعديل الاختيار</a>
    </header>
    <main class="pay-checkout-main">
        <h1>إتمام الدفع</h1>
        <p id="checkout-summary" class="pay-checkout-summary">جاري التحميل…</p>
        <p id="pay-test-banner" class="pay-checkout-banner" hidden>وضع تجريبي (pk_test) — للاختبار فقط.</p>
        <p id="checkout-error" class="pay-checkout-banner" hidden></p>
        <p id="checkout-fallback" class="pay-checkout-banner" hidden>
            تعذر عرض حقول البطاقة. حدّث الصفحة أو جرّب متصفح Safari/Chrome. إن استمرت المشكلة راسلنا على
            <a href="mailto:raddad@raddad.sa">raddad@raddad.sa</a>.
        </p>
        <div class="moyasar-wrap">
            <div class="mysr-form"></div>
        </div>
    </main>
    <script src="/js/payment-config.js?v=2"></script>
    <script src="/js/firebase-config.js"></script>
    <script>
        (function () {
            var link = new URLSearchParams(window.location.search).get('link');
            var back = document.querySelector('.pay-checkout-header a[href="/pay.html"]');
            if (link && back) {
                back.href = '/pay-request.html?link=' + encodeURIComponent(link);
                back.textContent = '← الرجوع';
            }
            if (link) {
                var mod = document.createElement('script');
                mod.type = 'module';
                mod.src = '/js/payLinkCheckout.bundle.js?v=1';
                document.body.appendChild(mod);
                return;
            }
            var moyasar = document.createElement('script');
            moyasar.src = 'https://cdn.moyasar.com/mpf/1.14.0/moyasar.js';
            moyasar.onload = function () {
                var init = document.createElement('script');
                init.src = '/js/pay-checkout-init.js?v=3';
                document.body.appendChild(init);
            };
            document.body.appendChild(moyasar);
        })();
    </script>
</body>
</html>
