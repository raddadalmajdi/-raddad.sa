<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>طلب دفع | raddad.sa</title>
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/pay-simple.css">
</head>
<body class="pay-simple">
    <header class="pay-simple__header">
        <a href="/">رّداد · raddad.sa</a>
    </header>
    <main class="pay-simple__main">
        <h1>طلب دفع</h1>
        <p id="pay-request-loading" class="pay-simple__lead">جاري التحميل…</p>
        <p id="pay-request-error" class="pay-simple__banner pay-simple__banner--warn" hidden></p>
        <div id="pay-request-card" class="pay-simple__form" hidden>
            <p class="pay-simple__label">الخدمة</p>
            <p id="pay-request-title" class="pay-simple__summary" style="margin-top:0;font-size:1rem;"></p>
            <p class="pay-simple__label">المبلغ</p>
            <p id="pay-request-amount" class="pay-simple__summary" style="margin-top:0;font-size:1.1rem;"></p>
            <a id="pay-request-go" class="pay-simple__submit" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:16px;">
                متابعة الدفع
            </a>
            <p class="pay-simple__lead" style="margin-top:12px;margin-bottom:0;">مدى · Visa · Mastercard عبر ميسر</p>
        </div>
    </main>
    <script src="/js/firebase-config.js"></script>
    <script type="module" src="/js/payRequest.bundle.js"></script>
</body>
</html>
