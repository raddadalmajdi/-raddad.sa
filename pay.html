<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>الدفع | raddad.sa</title>
    <meta name="description" content="دفع آمن عبر ميسر — اختر الخدمة وأكمل الدفع.">
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/pay-simple.css">
</head>
<body class="pay-simple">
    <header class="pay-simple__header">
        <a href="/">رّداد · raddad.sa</a>
        <a href="/pricing.html">الأسعار</a>
    </header>

    <main class="pay-simple__main">
        <h1>الدفع</h1>
        <p class="pay-simple__lead">اختر الخدمة — الدفع عبر ميسر (مدى · Visa · Apple Pay)</p>

        <div id="pay-inactive-notice" class="pay-simple__banner pay-simple__banner--warn" hidden>
            الدفع غير مفعّل بعد. <a href="mailto:raddad@raddad.sa">raddad@raddad.sa</a>
        </div>
        <div id="pay-test-banner" class="pay-simple__banner pay-simple__banner--warn" hidden role="status">
            وضع تجريبي — للاختبار فقط.
        </div>

        <form id="pay-form" class="pay-simple__form">
            <div id="pay-plan-picker" class="pay-simple__plans"></div>

            <div class="pay-simple__field" id="pay-custom-amount-field" hidden>
                <label for="pay-custom-amount">المبلغ (ر.س)</label>
                <input id="pay-custom-amount" name="custom_amount" type="number" min="5000" step="1" inputmode="numeric" placeholder="15000">
            </div>

            <p class="pay-simple__label">طريقة الدفع</p>
            <div class="pay-simple__channels">
                <label class="pay-simple__pill">
                    <input type="radio" name="pay_channel" value="card" checked>
                    <span>بطاقة</span>
                </label>
                <label class="pay-simple__pill">
                    <input type="radio" name="pay_channel" value="applepay">
                    <span>Apple Pay</span>
                </label>
            </div>

            <p id="pay-summary" class="pay-simple__summary"></p>
            <button class="pay-simple__submit" type="submit">متابعة الدفع</button>
            <p class="form-message" hidden></p>
        </form>

        <p class="pay-simple__legal">
            <a href="/refund.html">الاسترجاع</a> · <a href="/privacy.html">الخصوصية</a> · <a href="/terms.html">الشروط</a>
        </p>
    </main>

    <script src="/js/payment-config.js"></script>
    <script type="module" src="/js/pay.bundle.js?v=9"></script>
</body>
</html>
